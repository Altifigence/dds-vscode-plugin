name: Public source checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: source-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  node:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Verify packed external consumer
        run: |
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/dds-consumer"
          tar -xzf "$RUNNER_TEMP"/*.tgz -C "$RUNNER_TEMP/dds-consumer"
          node scripts/packed-consumer-smoke.mjs "$RUNNER_TEMP/dds-consumer/package"
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2eae45db285e407f22119950686d47e1101e071b
        with:
          toolchain: 1.88.0
          components: clippy,rustfmt
      - run: cargo fmt --manifest-path native/Cargo.toml --check
      - run: cargo test --manifest-path native/Cargo.toml --locked --all-targets
      - run: cargo clippy --manifest-path native/Cargo.toml --locked --all-targets -- -D warnings
